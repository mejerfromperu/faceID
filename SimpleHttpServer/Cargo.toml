[package]
name = "SimpleHttpServer"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
reqwest = { version = "0.12.15", features = ["blocking"] }
serial = "0.4.0"
rand = "0.9.0"
uuid = { version = "1.16.0", features = ["v4"] }
serial_test = "3.2.0"


[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'
